name: Build and Push to ECR

on:
    workflow_dispatch:
        inputs:
            domain:
                description: Domain to build for (vscz, vssk, vsde, cu)
                required: true
                type: string
            dev:
                description: Release to dev
                default: false
                type: boolean
            prod:
                description: Release to prod
                default: false
                type: boolean
    workflow_call:
        inputs:
            domain:
                description: Domain to build for (vscz, vssk, vsde, cu)
                required: true
                type: string
            dev:
                description: Release to dev
                default: false
                type: boolean
            prod:
                description: Release to prod
                default: false
                type: boolean
            version:
                description: "Image tag version (e.g. dev-2026-05-16-06-09-17-25954618498). Computed automatically if not provided."
                required: false
                type: string

concurrency:
    group: ${{ github.workflow }}-${{ inputs.domain }}
    cancel-in-progress: false # never disable build!

permissions:
    id-token: write
    contents: read
    packages: read

jobs:
    lint:
        name: Lint Dockerfile
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v6.0.2

            - name: Run ShellCheck
              uses: ludeeus/action-shellcheck@2.0.0
              env:
                  SHELLCHECK_OPTS: -e SC1090

            - uses: hadolint/hadolint-action@v3.3.0
              with:
                  dockerfile: Dockerfile

    prepare:
        name: Prepare build metadata
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - name: Compute version
              id: version
              run: |
                  if [ -n "${{ inputs.version }}" ]; then
                    echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
                  else
                    echo "version=$(date +'%Y-%m-%d-%H-%M-%S')-${{ github.run_id }}" >> $GITHUB_OUTPUT
                  fi

    build:
        name: Build and Push Image (${{ inputs.domain }} / ${{ matrix.account.tier }})
        runs-on: ubuntu-latest
        needs: [lint, prepare]

        strategy:
            matrix:
                account:
                    - tier: dev
                      id: 972379852442
                      release: ${{ inputs.dev }}
                    - tier: prod
                      id: 658735297577
                      release: ${{ inputs.prod }}

        env:
            MAINTAINER: vysokeskoly
            domain: ${{ inputs.domain }}
            context: solrFeeder
            contextLower: solrfeeder
            purpose: ${{ matrix.account.tier }}

        steps:
            - name: Check out code
              if: ${{ matrix.account.release == true }}
              uses: actions/checkout@v6.0.2

            - name: Configure AWS credentials
              if: ${{ matrix.account.release == true }}
              uses: aws-actions/configure-aws-credentials@v6.1.1
              with:
                  role-to-assume: arn:aws:iam::${{ matrix.account.id }}:role/${{ env.domain }}.${{ env.context }}DeployRole
                  role-session-name: "GHA-${{ github.repository_owner }}+${{ github.event.repository.name }},R${{ github.run_id }},A${{ github.run_attempt }}"
                  aws-region: eu-central-1
                  mask-aws-account-id: false

            - name: Login to Amazon ECR
              if: ${{ matrix.account.release == true }}
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2.1.5
              with:
                  registries: ${{ matrix.account.id }}

            - name: Set dynamic environment variables
              if: ${{ matrix.account.release == true }}
              id: manager
              env:
                  ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                  serviceLower: "${{ env.domain }}-${{ env.contextLower }}"
              run: |
                  echo "imageFrom=$(grep 'FROM' Dockerfile | head -n 1 | awk '{ print $2 }' | tr -d '\n')" >> $GITHUB_OUTPUT
                  echo "version=${{ needs.prepare.outputs.version }}" >> $GITHUB_OUTPUT
                  echo "localImageName=${{ env.ECR_REGISTRY }}/${{ env.serviceLower }}" >> $GITHUB_OUTPUT

            - name: Docker meta
              if: ${{ matrix.account.release == true }}
              uses: docker/metadata-action@v6.0.0
              id: meta
              with:
                  images: |
                      ${{ steps.manager.outputs.localImageName }}
                  flavor: |
                      latest=false
                  tags: |
                      type=raw,enable=true,priority=200,value=${{ env.purpose }}-${{ steps.manager.outputs.version }}

            - name: Build and push Docker image
              if: ${{ matrix.account.release == true }}
              uses: docker/build-push-action@v7.1.0
              env:
                  DOCKER_BUILD_SUMMARY: "false"
              with:
                  context: .
                  push: true
                  pull: true
                  no-cache: true
                  build-args: |
                      REGISTRY=${{ steps.login-ecr.outputs.registry }}
                      DOMAIN=${{ env.domain }}
                      BUILD_NUMBER=${{ github.run_id }}
                      GIT_REPO=${{ github.repository }}
                      GIT_COMMIT=${{ github.sha }}
                      GIT_BRANCH=${{ github.head_ref }}
                      MAINTAINER="${{ env.MAINTAINER }}"
                      VENDOR=${{ env.MAINTAINER }}
                      FROM=${{ steps.manager.outputs.imageFrom }}
                      PRIVATE_FEED_USER=${{ github.repository_owner }}
                  secrets: |
                      PRIVATE_FEED_PASS=${{ secrets.GITHUB_TOKEN }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}

