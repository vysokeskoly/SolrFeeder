name: Release to dev

on:
    pull_request:

jobs:
    tests:
        name: PHP checks
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v6.0.2

            -   name: '[PHP] Setup'
                uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.1
                    extensions: mbstring, intl

            -   name: '[INIT] Check composer.json'
                run: composer validate --no-check-all --no-check-publish --no-check-lock

            -   name: '[INIT] Install dependencies'
                run: composer install

            -   name: '[CHECK] analyze'
                run: composer analyze

            -   name: '[CHECK] phpstan'
                run: composer phpstan

            -   name: '[CHECK] Unit tests'
                run: composer test-ci

    prepare:
        name: Prepare build metadata
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - name: Compute version
              id: version
              run: echo "version=$(date +'%Y-%m-%d-%H-%M-%S')-${{ github.run_id }}" >> $GITHUB_OUTPUT

    cd:
        name: Build ${{ matrix.domain }}
        needs: [tests, prepare]
        strategy:
            matrix:
                domain: [vscz, vssk, vsde, cu]
        uses: ./.github/workflows/cd.yaml
        with:
            domain: ${{ matrix.domain }}
            dev: true
            version: ${{ needs.prepare.outputs.version }}
        permissions:
            id-token: write
            contents: read
            packages: read

    summarize:
        name: Release summary
        runs-on: ubuntu-latest
        needs: [prepare, cd]
        steps:
            - uses: actions/github-script@v9.0.0
              with:
                  script: |
                      const version = 'dev-${{ needs.prepare.outputs.version }}'
                      const domains = ['vscz', 'vssk', 'vsde', 'cu']
                      const svcContext = 'solrfeeder'
                      const registry = '972379852442.dkr.ecr.eu-central-1.amazonaws.com'

                      core.summary.addHeading('🚀 Release to dev')
                      core.summary.addRaw('Built and pushed images for all domains:')
                      core.summary.addList(domains.map(d => `${registry}/${d}-${svcContext}:${version}`))
                      core.summary.addHeading('Version', 3)
                      core.summary.addCodeBlock(version)
                      core.summary.addRaw('Update <code>${svcContext}.image.tag</code> in <code>values-dev.yaml</code> to the version above.')
                      core.summary.write()
